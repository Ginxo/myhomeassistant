blueprint:
  name: Motion-activated Switch with posible conditions
  description: Turn on a switch when motion is detected.
  domain: automation
  source_url: https://github.com/Ginxo/myhomeassistant/blob/main/blueprints/motion_switch.yaml
  author: Enrique Mingorance
  input:
    motion_entity:
      name: Motion Sensor
      selector:
        entity:
          filter:
          - device_class:
            - occupancy
            domain:
            - binary_sensor
          - device_class:
            - motion
            domain:
            - binary_sensor
          reorder: false
          multiple: false
    switch_target:
      name: Switch
      selector:
        target:
          entity:
          - domain:
            - switch
    additional_actions:
      name: Actions
      description: Additional actions to be triggered when motion is detected
      default: []
      selector:
        action: {}
    additional_actions_after:
      name: Actions after wait
      description: Additional actions to be triggered after motion stops and wait time ends
      default: []
      selector:
        action: {}
    switch_off:
      name: Switch off
      description: Additional switches to turn off
      default: {}
      selector:
        target:
          entity:
          - domain:
            - switch
    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected.
      default: 5
      selector:
        number:
          min: 0.0
          max: 3600.0
          unit_of_measurement: seconds
          step: 1.0
          mode: slider
    condition:
      name: Add Condition(s) to run this Automation
      description: Add conditions if needed to run this automation at all. Note, if
        conditions return `false`, no actions will fire.
      default: []
      selector:
        condition: {}
mode: restart
max_exceeded: silent
triggers:
  trigger: state
  entity_id: !input motion_entity
  from: 'off'
  to: 'on'
actions:
- if:
  - condition: !input condition
  then:
  - alias: Turn on the switch
    action: switch.turn_on
    target: !input switch_target
  - sequence: !input additional_actions
  - alias: Wait until there is no motion from device
    wait_for_trigger:
      trigger: state
      entity_id: !input motion_entity
      from: 'on'
      to: 'off'
  - alias: Wait the number of seconds that has been set
    delay: !input no_motion_wait
  - alias: Turn off the switch
    action: switch.turn_off
    target: !input switch_target
  - alias: Turn off the additional switch
    action: switch.turn_off
    target: !input switch_off
    continue_on_error: true
  - sequence: !input additional_actions_after
